<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Header</title>
    <style>
      /* Mobile First Design */
      body {
        margin: 0;
        padding: 0;
      }

      #pageheader {
        background-color: green;
        padding: 1rem;
        border: 1px solid silver;
      }
      #logo {
        width: 100px;
        height: 100px;
        background-color: lightgreen;
        border-radius: 50%;
        border: 2px solid black;
        margin: auto;
        margin-bottom: 1rem;
      }
      #pageheader nav {
        background-color: orange;
        padding: 1rem;
      }
      #pageheader ul {
        background-color: rgb(124, 47, 13);
        list-style-type: none;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <header id="pageheader">
      <div class="div" id="logo"></div>
      <nav>
        <ul>
          <li>Home</li>
          <li>Why Adopt</li>
          <li>Pet Gallery</li>
          <li>Testimonials</li>
        </ul>
      </nav>
    </header>
  </body>
</html>
